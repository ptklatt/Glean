name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a v* tag after validation and environment approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Compute version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: |
          $prefix = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.VersionPrefix
          $isVersionTag = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')
          if ($env:PUBLISH_REQUESTED -eq 'true' -and -not $isVersionTag) {
            throw 'Publishing requires a v* tag.'
          }
          if ($isVersionTag) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "$prefix-alpha.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Glean.slnx

      - name: Build library, samples, benchmarks and package verifier
        run: dotnet build Glean.slnx -c Release --no-restore --nologo -warnaserror -p:Version=$env:PACKAGE_VERSION

      - name: Test .NET 8, .NET 9 and .NET 10
        run: dotnet test test/Glean.Tests/Glean.Tests.csproj -c Release --no-build --no-restore --nologo -p:TestTfmsInParallel=false

      - name: Validate .NET 8 benchmark workloads
        run: dotnet run --project bench/Glean.Benchmarks -c Release -f net8.0 --no-build -- --validate

      - name: Validate .NET 9 benchmark workloads
        run: dotnet run --project bench/Glean.Benchmarks -c Release -f net9.0 --no-build -- --validate

      - name: Validate .NET 10 benchmark workloads
        run: dotnet run --project bench/Glean.Benchmarks -c Release -f net10.0 --no-build -- --validate

      - name: Pack
        run: dotnet pack src/Glean/Glean.csproj -c Release --no-build --no-restore -o artifacts/packages -p:Version=$env:PACKAGE_VERSION

      - name: Inspect packages and compile isolated consumers
        run: dotnet run --project eng/VerifyPackage -c Release --no-build -- artifacts/packages $env:PACKAGE_VERSION $env:GITHUB_SHA

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: glean-${{ runner.os }}-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  verify-release-package:
    needs: build-test-package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve Linux package text bytes
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Compute version
        run: |
          $prefix = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.VersionPrefix
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "$prefix-alpha.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: glean-Linux-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages
          digest-mismatch: error

      - name: Restore
        run: dotnet restore Glean.slnx

      - name: Build package verifier
        run: dotnet build eng/VerifyPackage -c Release --no-restore --nologo -warnaserror -p:Version=$env:PACKAGE_VERSION

      - name: Inspect Linux packages and run isolated Windows consumers
        run: dotnet run --project eng/VerifyPackage -c Release --no-build -- artifacts/packages $env:PACKAGE_VERSION $env:GITHUB_SHA

  publish:
    needs: verify-release-package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: nuget
    concurrency:
      group: nuget-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compute version
        run: '"PACKAGE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV'

      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: glean-Linux-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages
          digest-mismatch: error

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Configure NUGET_API_KEY in the nuget environment.'
          }
          foreach ($extension in @('nupkg', 'snupkg')) {
            if (-not (Test-Path "artifacts/packages/Glean.$env:PACKAGE_VERSION.$extension" -PathType Leaf)) {
              throw "Missing validated $extension package."
            }
          }
          dotnet nuget push "artifacts/packages/Glean.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
